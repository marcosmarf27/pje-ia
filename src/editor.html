<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Editor de minutas — TecJustiça PJe</title>
    <link rel="stylesheet" href="fontes.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="../vendor/jodit.min.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="topo">
      <img src="../icons/icon48.png" alt="" width="28" height="28" />
      <div class="tit">
        <input
          id="titulo"
          class="t serif"
          type="text"
          value="Minuta"
          aria-label="Título do documento (usado no nome do arquivo)"
          spellcheck="false"
        />
        <span class="s" id="subtitulo">carregando…</span>
      </div>
      <div class="acoes">
        <span class="grupo drop-wrap" role="group" aria-label="Rascunhos">
          <button id="rascunhos" class="ghost" title="Ver e abrir minutas guardadas neste computador"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h5.5l2 2H20v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg><span>Rascunhos</span></button>
          <div id="drop" class="drop" hidden aria-label="Minutas guardadas"></div>
        </span>
        <span class="grupo" role="group" aria-label="Exportar">
          <button id="copiar" title="Copiar com formatação para colar no editor de minutas do PJe">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a2 2 0 0 0-2 2v9"/></svg><span>Copiar formatado</span>
          </button>
          <button id="docx" title="Baixar o documento em Word (.docx)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg><span>.docx</span></button>
          <button id="reid" hidden title="Esta minuta foi gerada em modo sigiloso: os nomes foram trocados por rótulos ([PESSOA_1]) antes de ir à IA. Restaura os nomes pela tabela guardada neste computador."><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0"/></svg><span>Restaurar nomes</span></button>
          <button id="imprimir" title="Imprimir ou salvar em PDF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="3.5" y="9" width="17" height="7" rx="2"/><path d="M7 14h10v6H7z"/></svg><span>Imprimir</span></button>
        </span>
        <span class="grupo estado">
          <span id="salvo" class="salvo" aria-live="polite"></span>
          <button id="descartar" class="ghost" title="Apagar este rascunho do computador">
            Descartar
          </button>
        </span>
      </div>
    </header>

    <!-- O Jodit monta a barra de ferramentas AQUI (config `toolbar`), fora do
         container do editor: assim ela ocupa a largura da janela e fica fixa,
         em vez de espremer-se na largura da folha A4 e quebrar em duas filas. -->
    <div id="barra" class="barra"></div>

    <main class="mesa">
      <!-- Registro da orientação que gerou a minuta (Res. CNJ 615/2025, arts.
           19, §6º e 21, §2º). Preenchido por `mostrarOrigem`; some quando a
           minuta é anterior a esta versão. Fica FORA da folha: o que vai ao
           PJe é o ato. -->
      <details class="origem" id="origem" hidden></details>
      <div class="folha-wrap">
        <textarea id="ed" aria-label="Texto da minuta"></textarea>
      </div>
      <div class="aviso" id="aviso" hidden></div>
    </main>

    <p class="rodape-nota">
      Rascunho guardado neste computador para você reabrir depois — use
      <b>Descartar</b> quando terminar. Confira o texto e as citações antes de usar:
      a minuta é uma sugestão, não um ato.
    </p>

    <script src="../vendor/jodit.min.js"></script>
    <script src="../vendor/docx.iife.js"></script>
    <script src="pseudonimos.js"></script>
    <script src="minuta-md.js"></script>
    <script src="editor-docx.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
